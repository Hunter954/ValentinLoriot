name: Validate portfolio
on:
  push:
    branches: [main, feat/dokploy-vps-storage]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: portfolio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://portfolio:ci-only-password@localhost:5432/portfolio_test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t valentin-portfolio:test .
      - name: Validate production image with PostgreSQL
        run: |
          docker run --rm --network host --user root \
            -e TEST_DATABASE_URL \
            valentin-portfolio:test sh -c \
            'pip install --no-cache-dir pytest==9.1.1 && python -m compileall -q app && python -m pytest -q'
