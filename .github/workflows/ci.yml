name: Validate portfolio
on:
  push:
    branches: [main, feat/dokploy-vps-storage]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: portfolio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://portfolio:ci-only-password@localhost:5432/portfolio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock pytest==9.1.1
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg postgresql-client-16
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - run: docker build -t valentin-portfolio:test .
