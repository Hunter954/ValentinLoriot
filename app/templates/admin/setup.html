<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Primeiro acesso • Valentin Loriot</title><link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}"></head><body class="login-page"><form method="post" class="login-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h1>Primeiro acesso</h1><p>Defina a senha do painel. Esta configuração fica indisponível após a criação da conta.</p><label>E-mail<input value="{{ email }}" type="email" disabled></label><label>Chave de configuração<input name="setup_token" type="password" required autocomplete="off"></label><label>Senha<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><label>Confirmar senha<input name="confirm_password" type="password" minlength="12" required autocomplete="new-password"></label><button>Criar minha conta</button></form></body></html>
